                  type: string
                  format: binary
      responses:
        "201":
          description: File diupload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      file:
                        $ref: "#/components/schemas/DocFile"

  /api/v1/docs/{doc}/files/{docFile}:
    delete:
      tags: [Docs]
      summary: Hapus file dari dokumen
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/DocId"
        - $ref: "#/components/parameters/DocFileId"
      responses:
        "204":
          description: File dihapus

  /api/v1/doc-files/{docFile}:
    get:
      tags: [Docs]
      summary: Download / tampilkan file dokumen
      security:
        - sanctumBearer: [read]
      parameters:
        - $ref: "#/components/parameters/DocFileId"
      responses:
        "200":
          description: Binary file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ─── CAPTURE ───────────────────────────────────────────────────────────────

  /api/v1/quick-capture:
    post:
      tags: [Capture]
      summary: Quick capture — buat record dari payload ringkas
      description: |
        Endpoint utama untuk **bot Telegram / Groq AI**. Kirim teks yang sudah diparsing LLM
        ke endpoint ini untuk membuat task, work log, daily progress, atau learning entry.

        Gunakan header `Idempotency-Key` untuk mencegah duplikasi saat retry (berlaku 24 jam).

        **Mapping type → modul:**
        - `task` → Tasks
        - `blocker` → Tasks (dengan status `blocked`)
        - `work_log` → Work Logs
        - `daily_progress` → Daily Progress
        - `learning` → Learning

        Response menyertakan `record_path` yang bisa dipakai untuk redirect ke record yang dibuat.
      security:
        - sanctumBearer: [capture]
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
          description: Key unik untuk deduplikasi retry selama 24 jam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickCaptureRequest"
            examples:
              create_task:
                summary: Buat task
                value:
                  type: task
                  title: Implementasi endpoint notifications
                  project_name: ProgressOS
                  notes: Sesuai spec di notion
              create_work_log:
                summary: Catat work log
                value:
                  type: work_log
                  title: Review pull request API docs
                  project_name: ProgressOS
                  duration_minutes: 30
                  date: "2026-06-19"
              create_blocker:
                summary: Catat blocker
                value:
                  type: blocker
                  title: Deploy staging gagal — Docker issue
                  project_name: ProgressOS
              create_learning:
                summary: Catat sesi belajar
                value:
                  type: learning
                  title: Goroutines dan channels di Go
                  duration_minutes: 60
                  notes: Baca chapter 8 The Go Programming Language
              create_daily_progress:
                summary: Catat daily progress
                value:
                  type: daily_progress
                  title: Progress harian 19 Juni
                  notes: Fokus ke API docs dan Telegram bot integration
      responses:
        "201":
          description: Record dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      record:
                        type: object
                        description: Record yang dibuat (shape sesuai type)
                      record_path:
                        type: ["string", "null"]
                        description: Path ke record, misal `/tasks/42`
              example:
                data:
                  id: 42
                  title: Implementasi endpoint notifications
                  status: todo
                  priority: medium
                record:
                  id: 42
                  title: Implementasi endpoint notifications
                  status: todo
                  priority: medium
                record_path: /tasks/42
                message: Captured.

  # ─── REPORTS ───────────────────────────────────────────────────────────────

  /api/v1/reports/{period}:
    get:
      tags: [Reports]
      summary: Laporan mingguan atau bulanan
      security:
        - sanctumBearer: [reports]
      parameters:
        - $ref: "#/components/parameters/Period"
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Tanggal dalam periode yang diinginkan (default minggu/bulan ini)
      responses:
        "200":
          description: Payload laporan
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/reports/{period}/export:
    get:
      tags: [Reports]
      summary: Export laporan ke CSV
      security:
        - sanctumBearer: [reports]
      parameters:
        - $ref: "#/components/parameters/Period"
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: File CSV
          content:
            text/csv:
              schema:
                type: string

  /api/v1/reports/{period}/export-pdf:
    get:
      tags: [Reports]
      summary: Export laporan ke PDF
      security:
        - sanctumBearer: [reports]
      parameters:
        - $ref: "#/components/parameters/Period"
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: File PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /api/v1/reports/{period}/snapshots:
    get:
      tags: [Reports]
      summary: Daftar snapshot laporan tersimpan
      security:
        - sanctumBearer: [reports]
      parameters:
        - $ref: "#/components/parameters/Period"
      responses:
        "200":
          description: Koleksi snapshot
    post:
      tags: [Reports]
      summary: Simpan snapshot laporan
      security:
        - sanctumBearer: [reports]
      parameters:
        - $ref: "#/components/parameters/Period"
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "201":
          description: Snapshot disimpan

  # ─── SEARCH ────────────────────────────────────────────────────────────────

  /api/v1/search:
    get:
      tags: [Search]
      summary: Pencarian global lintas semua modul
      description: Mengembalikan hingga 8 hasil per modul. Mencari di tasks, work logs, daily progress, learning, milestones, projects, goals, habits, dan docs.
      security:
        - sanctumBearer: [read]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Query pencarian
      responses:
        "200":
          description: Hasil pencarian dikelompokkan per modul
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      query: { type: string }
                      results:
                        type: object
                        properties:
                          daily_progress: { type: array, items: {} }
                          work_logs: { type: array, items: {} }
                          tasks: { type: array, items: {} }
                          learning: { type: array, items: {} }
                          milestones: { type: array, items: {} }
                          projects: { type: array, items: {} }
                          goals: { type: array, items: {} }
                          habits: { type: array, items: {} }
                          docs: { type: array, items: {} }

  # ─── ACTIVITY ──────────────────────────────────────────────────────────────

  /api/v1/activity:
    get:
      tags: [Activity]
      summary: Feed audit aktivitas (paginated, key `activity`)
      security:
        - sanctumBearer: [read]
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 10
            maximum: 50
      responses:
        "200":
          description: Feed aktivitas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      activity:
                        type: array
                        items:
                          $ref: "#/components/schemas/ActivityLog"

  # ─── SAVED VIEWS ───────────────────────────────────────────────────────────

  /api/v1/saved-views:
    get:
      tags: [Saved Views]
      summary: Daftar saved view
      security:
        - sanctumBearer: [read]
      parameters:
        - name: module
          in: query
          schema:
            type: string
            enum: [tasks, work-logs, daily-progress, learning, milestones]
      responses:
        "200":
          description: Koleksi saved view
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CollectionEnvelope"
                  - type: object
                    properties:
                      saved_views:
                        type: array
                        items:
                          $ref: "#/components/schemas/SavedView"
    post:
      tags: [Saved Views]
      summary: Simpan atau update saved view (upsert by module+name)
      security:
        - sanctumBearer: [write]
      requestBody:
        $ref: "#/components/requestBodies/SavedView"
      responses:
        "201":
          description: Saved view disimpan

  /api/v1/saved-views/{savedView}:
    delete:
      tags: [Saved Views]
      summary: Hapus saved view
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/SavedViewId"
      responses:
        "204":
          description: Dihapus

  /api/v1/saved-views/{savedView}/set-default:
    post:
      tags: [Saved Views]
      summary: Toggle default saved view untuk modul
      description: Meng-toggle `is_default`. Jika di-set default, view lain di modul yang sama akan di-unset. Panggil lagi untuk unset.
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/SavedViewId"
      responses:
        "200":
          description: Status default di-toggle
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      saved_view:
                        $ref: "#/components/schemas/SavedView"

  # ─── REFERENCES ────────────────────────────────────────────────────────────

  /api/v1/references:
    post:
      tags: [References]
      summary: Tambah referensi link ke sebuah record
      security:
        - sanctumBearer: [write]
      requestBody:
        $ref: "#/components/requestBodies/Reference"
      responses:
        "201":
          description: Referensi dibuat

  /api/v1/references/{reference}:
    delete:
      tags: [References]
      summary: Hapus referensi
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/ReferenceId"
      responses:
        "204":
          description: Dihapus

  # ─── CONFIGURATION ─────────────────────────────────────────────────────────

  /api/v1/configuration:
    get:
      tags: [Configuration]
      summary: Baca konfigurasi app (settings, backup, mail, notifikasi)
      security:
        - sanctumBearer: [read]
      responses:
        "200":
          description: Payload konfigurasi lengkap
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/configuration/settings:
    put:
      tags: [Configuration]
      summary: Update pengaturan umum, tampilan, dan notifikasi
      security:
        - sanctumBearer: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                general:
                  type: object
                  properties:
                    app_name: { type: string, maxLength: 80 }
                    project_name: { type: string, maxLength: 120 }
                    tagline: { type: string, maxLength: 180 }
                    timezone: { type: string, maxLength: 80 }
                appearance:
                  type: object
                  properties:
                    theme:
                      type: string
                      enum: [system, light, dark]
                    favicon_url: { type: string, maxLength: 500 }
                notifications:
                  type: object
                  properties:
                    daily_review_enabled: { type: boolean }
                    weekly_review_enabled: { type: boolean }
            example:
              general:
                app_name: ProgressOS
                timezone: Asia/Jakarta
              appearance:
                theme: dark
              notifications:
                daily_review_enabled: true
      responses:
        "200":
          description: Pengaturan disimpan

  /api/v1/configuration/auth:
    put:
      tags: [Configuration]
      summary: Update konfigurasi auth (Google SSO, dll.)
      security:
        - sanctumBearer: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Konfigurasi auth disimpan

  /api/v1/configuration/mail:
    put:
      tags: [Configuration]
      summary: Update konfigurasi mail (Resend / SMTP)
      security:
        - sanctumBearer: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailer]
              properties:
                mailer:
                  type: string
                  enum: [log, resend, smtp]
                from_address:
                  type: ["string", "null"]
                  format: email
                from_name:
                  type: ["string", "null"]
                api_key:
                  type: ["string", "null"]
                  description: API key Resend
                host:
                  type: ["string", "null"]
                  description: SMTP host
                port:
                  type: ["integer", "null"]
                username:
                  type: ["string", "null"]
                password:
                  type: ["string", "null"]
            example:
              mailer: resend
              from_address: noreply@yourdomain.com
              from_name: ProgressOS
              api_key: re_xxx
      responses:
        "200":
          description: Konfigurasi mail disimpan

  /api/v1/configuration/backup-connection:
    put:
      tags: [Configuration]
      summary: Simpan kredensial koneksi backup (Google Sheets)
      security:
        - sanctumBearer: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Koneksi backup disimpan

  /api/v1/configuration/backup-connection/verify:
    post:
      tags: [Configuration]
      summary: Verifikasi koneksi backup Google Sheets
      security:
        - sanctumBearer: [write]
      responses:
        "200":
          description: Hasil verifikasi

  /api/v1/configuration/backup-syncs:
    post:
      tags: [Configuration]
      summary: Buat jadwal backup sync
      security:
        - sanctumBearer: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Sync dibuat

  /api/v1/configuration/backup-syncs/{sync}:
    patch:
      tags: [Configuration]
      summary: Update jadwal backup sync
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/SyncId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Sync diperbarui
    delete:
      tags: [Configuration]
      summary: Hapus jadwal backup sync
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/SyncId"
      responses:
        "204":
          description: Sync dihapus

  /api/v1/configuration/backup-syncs/{sync}/run:
    post:
      tags: [Configuration]
      summary: Jalankan backup sync sekarang
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/SyncId"
      responses:
        "200":
          description: Sync dijalankan

components:

  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: "Laravel Sanctum personal access token (prefix: pos_)"

  parameters:
    Search:
      name: search
      in: query
      schema: { type: string }
      description: Full-text search
    From:
      name: from
      in: query
      schema: { type: string, format: date }
      description: Filter dari tanggal (YYYY-MM-DD)
    To:
      name: to
      in: query
      schema: { type: string, format: date }
      description: Filter sampai tanggal (YYYY-MM-DD)
    Sort:
      name: sort
      in: query
      schema: { type: string }
      description: Nama field untuk sorting
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum: [asc, desc]
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 6
        maximum: 50
      description: Jumlah item per halaman (default 20)
    Period:
      name: period
      in: path
      required: true
      schema:
        type: string
        enum: [weekly, monthly]
    TokenId: { name: token, in: path, required: true, schema: { type: integer } }
    ProjectId: { name: project, in: path, required: true, schema: { type: integer } }
    DailyProgressId: { name: dailyProgress, in: path, required: true, schema: { type: integer } }
    WorkLogId: { name: workLog, in: path, required: true, schema: { type: integer } }
    TaskId: { name: task, in: path, required: true, schema: { type: integer } }
    LearningId: { name: learning, in: path, required: true, schema: { type: integer } }
    MilestoneId: { name: milestone, in: path, required: true, schema: { type: integer } }
    HabitId: { name: habit, in: path, required: true, schema: { type: integer } }
    GoalId: { name: goal, in: path, required: true, schema: { type: integer } }
    KeyResultId: { name: keyResult, in: path, required: true, schema: { type: integer } }
    NotificationId: { name: notification, in: path, required: true, schema: { type: integer } }
    DocId: { name: doc, in: path, required: true, schema: { type: integer } }
    DocFileId: { name: docFile, in: path, required: true, schema: { type: integer } }
    SavedViewId: { name: savedView, in: path, required: true, schema: { type: integer } }
    ReferenceId: { name: reference, in: path, required: true, schema: { type: integer } }
    SyncId: { name: sync, in: path, required: true, schema: { type: integer } }

  requestBodies:
    Project:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectRequest"
          example:
            name: ProgressOS
            color: "#6366f1"
            archived: false
    DailyProgress:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DailyProgressRequest"
          example:
            date: "2026-06-19"
            title: Progress Kamis 19 Juni
            in_progress: Implementasi Telegram bot integration
            todo: Tulis unit tests
            blockers: null
            notes: Hari produktif — API docs selesai
            completed_items: ["Selesaikan openapi.yaml", "Setup Scalar UI"]
            mood: great
            tags: [api, docs]
    WorkLog:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkLogRequest"
          example:
            date: "2026-06-19"
            project_name: ProgressOS
            title: Tulis dokumentasi API lengkap
            category: documentation
            status: done
            priority: high
            actual_duration: 120
            estimated_duration: 90
            description: Rewrite openapi.yaml dengan semua endpoint dan schema
    Task:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TaskRequest"
          example:
            title: Buat Telegram bot client
            status: todo
            priority: high
            project_id: 1
            notes: Gunakan python-telegram-bot + Groq API
            due_date: "2026-07-01"
    Learning:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LearningRequest"
          example:
            date: "2026-06-19"
            topic: Goroutines dan channels
            category: programming
            source_type: book
            duration_minutes: 60
            takeaway: Goroutine lebih ringan dari thread OS, channels untuk komunikasi
            rating: 5
    Milestone:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MilestoneRequest"
    SavedView:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SavedViewRequest"
          example:
            module: tasks
            name: High Priority Today
            filters:
              priority: high
              status: todo
            pinned: true
    Reference:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReferenceRequest"
          example:
            referenceable_type: task
            referenceable_id: 42
            label: Design doc Telegram bot
            url: https://notion.so/abc123
            type: doc
    Doc:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocRequest"
          example:
            title: Panduan Deploy Laravel ke VPS
            category: DevOps
            description: Step-by-step dari zero sampai production
            reference_urls:
              - title: Laravel Forge Docs
                url: https://forge.laravel.com/docs

  responses:
    OkResponse:
      description: Sukses
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    UserResponse:
      description: Data user
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
          example:
            data:
              id: 1
              name: Yosri
              email: yosri@example.com
              timezone: Asia/Jakarta
              theme: dark
              avatar_url: null
            user:
              id: 1
              name: Yosri
              email: yosri@example.com
              timezone: Asia/Jakarta
              theme: dark
              avatar_url: null
    PaginatedResponse:
      description: Response paginated generik
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaginatedEnvelope"
    PaginatedDailyProgress:
      description: Halaman entri progress harian
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedEnvelope"
              - type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/DailyProgress"
    PaginatedWorkLogs:
      description: Halaman work log
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedEnvelope"
              - type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkLog"
    PaginatedTasks:
      description: Halaman task
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedEnvelope"
              - type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
    PaginatedLearning:
      description: Halaman entri belajar
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedEnvelope"
              - type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/LearningEntry"
    PaginatedMilestones:
      description: Halaman milestone
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedEnvelope"
              - type: object
                properties:
                  milestones:
                    type: array
                    items:
                      $ref: "#/components/schemas/Milestone"
    PaginatedDocs:
      description: Halaman dokumen
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedEnvelope"
              - type: object
                properties:
                  docs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Doc"
    ValidationError:
      description: Data input tidak valid (422)
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: The given data was invalid.
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
          example:
            message: The given data was invalid.
            errors:
              title: ["The title field is required."]
              status: ["The selected status is invalid."]

  schemas:

    # ── Envelopes ────────────────────────────────────────────────────────────

    Envelope:
      type: object
      properties:
        data:
          description: Payload utama record atau koleksi
        message:
          type: string
          description: Pesan sukses opsional
      additionalProperties: true

    CollectionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items: {}

    PaginatedEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items: {}
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: ["integer", "null"] }
            last_page: { type: integer }
            path: { type: string }
            per_page: { type: integer }
            to: { type: ["integer", "null"] }
            total: { type: integer }
        links:
          type: object
          properties:
            first: { type: ["string", "null"] }
            last: { type: ["string", "null"] }
            prev: { type: ["string", "null"] }
            next: { type: ["string", "null"] }
      additionalProperties: true
      example:
        meta:
          current_page: 1
          from: 1
          last_page: 3
          path: http://127.0.0.1:8000/api/v1/tasks
          per_page: 20
          to: 20
          total: 55
        links:
          first: http://127.0.0.1:8000/api/v1/tasks?page=1
          last: http://127.0.0.1:8000/api/v1/tasks?page=3
          prev: null
          next: http://127.0.0.1:8000/api/v1/tasks?page=2

    # ── User & Auth ──────────────────────────────────────────────────────────

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        timezone: { type: string, example: Asia/Jakarta }
        theme: { type: string, enum: [system, light, dark] }
        avatar_url: { type: ["string", "null"] }

    Token:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        abilities:
          type: array
          items: { type: string }
        last_used_at: { type: ["string", "null"], format: date-time }
        expires_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }

    # ── Projects ─────────────────────────────────────────────────────────────

    Project:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        color: { type: ["string", "null"], example: "#6366f1" }
        archived: { type: boolean }
        tasks_count: { type: integer }
        open_tasks_count: { type: integer }
        work_logs_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── Daily Progress ────────────────────────────────────────────────────────

    DailyProgress:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        title: { type: string }
        in_progress: { type: ["string", "null"] }
        todo: { type: ["string", "null"] }
        blockers: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        completed_items:
          type: array
          items: { type: string }
        mood: { type: ["string", "null"], example: great }
        archived: { type: boolean }
        tags: { type: array, items: {} }
        references: { type: array, items: {} }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── Work Logs ─────────────────────────────────────────────────────────────

    WorkLog:
      type: object
      properties:
        id: { type: integer }
        project_id: { type: ["integer", "null"] }
        task_id: { type: ["integer", "null"] }
        task:
          type: ["object", "null"]
          properties:
            id: { type: integer }
            title: { type: string }
        date: { type: string, format: date }
        project_name: { type: string }
        ticket_code: { type: ["string", "null"] }
        title: { type: string }
        category:
          type: string
          enum: [bug, feature, research, testing, setup, meeting, documentation, refactor, other]
        status:
          type: string
          enum: [todo, in_progress, done, blocked]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        description: { type: ["string", "null"] }
        resolution_or_outcome: { type: ["string", "null"] }
        estimated_duration: { type: ["integer", "null"], description: Estimasi menit }
        actual_duration: { type: ["integer", "null"], description: Durasi aktual menit }
        tags: { type: array, items: {} }
        references: { type: array, items: {} }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── Tasks ─────────────────────────────────────────────────────────────────

    Task:
      type: object
      properties:
        id: { type: integer }
        project_id: { type: ["integer", "null"] }
        milestone_id: { type: ["integer", "null"] }
        work_log_id: { type: ["integer", "null"] }
        title: { type: string }
        notes: { type: ["string", "null"] }
        status:
          type: string
          enum: [todo, in_progress, done, blocked]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        due_date: { type: ["string", "null"], format: date }
        completed_at: { type: ["string", "null"], format: date-time }
        recurrence_rule: { type: ["string", "null"], enum: [daily, weekly, monthly, custom, null] }
        recurrence_interval: { type: ["integer", "null"] }
        recurrence_days: { type: ["array", "null"], items: { type: integer } }
        recurrence_ends_at: { type: ["string", "null"], format: date }
        parent_task_id: { type: ["integer", "null"] }
        project: { type: ["object", "null"] }
        references: { type: array, items: {} }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KanbanCard:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status: { type: string, enum: [todo, in_progress, done, blocked] }
        due_date: { type: ["string", "null"], format: date }
        project_name: { type: ["string", "null"] }
        overdue: { type: boolean }

    # ── Learning ─────────────────────────────────────────────────────────────

    LearningEntry:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        topic: { type: string }
        category:
          type: string
          enum: [programming, english, japanese, german, books, career, other]
        source_type:
          type: string
          enum: [book, article, video, course, practice, podcast, other]
        duration_minutes: { type: integer }
        progress_notes: { type: ["string", "null"] }
        takeaway: { type: ["string", "null"] }
        next_action: { type: ["string", "null"] }
        rating: { type: ["integer", "null"], minimum: 1, maximum: 5 }
        references: { type: array, items: {} }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── Milestones ───────────────────────────────────────────────────────────

    Milestone:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string }
        target_type:
          type: string
          enum: [count, duration, streak, custom]
        source_type:
          type: string
          enum: [manual, work_log_count, work_log_minutes, learning_minutes, daily_progress_streak, task_done_count]
        source_filter: { type: ["string", "null"], description: Filter opsional misal nama project atau kategori }
        target_value: { type: number }
        current_value: { type: number }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        start_date: { type: ["string", "null"], format: date }
        end_date: { type: ["string", "null"], format: date }
        status:
          type: string
          enum: [active, paused, completed, cancelled]
        notes: { type: ["string", "null"] }
        completed_at: { type: ["string", "null"], format: date-time }
        references: { type: array, items: {} }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── Habits ───────────────────────────────────────────────────────────────

    Habit:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        icon: { type: ["string", "null"], description: Emoji icon }
        frequency:
          type: string
          enum: [daily, weekly]
        target_days:
          type: ["array", "null"]
          items: { type: integer, minimum: 0, maximum: 6 }
          description: "Hari target: 0=Minggu, 1=Senin, ..., 6=Sabtu"
        active: { type: boolean }
        order: { type: integer }
        today_done: { type: boolean, description: Apakah sudah di-log hari ini }
        streak: { type: integer, description: Streak hari berturut-turut }
        week_dates:
          type: array
          items: { type: string, format: date }
          description: Tanggal log minggu ini
        heatmap:
          type: array
          items: { type: string, format: date }
          description: Tanggal log 90 hari terakhir
        total_logs: { type: integer }

    # ── Goals ─────────────────────────────────────────────────────────────────

    Goal:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        period_label: { type: ["string", "null"], example: "Q3 2026" }
        start_date: { type: ["string", "null"], format: date }
        end_date: { type: ["string", "null"], format: date }
        status:
          type: string
          enum: [draft, active, completed, abandoned]
        color: { type: ["string", "null"] }
        progress: { type: integer, minimum: 0, maximum: 100, description: Rata-rata progress KR }
        key_results:
          type: array
          items:
            $ref: "#/components/schemas/KeyResult"
        created_at: { type: string, format: date-time }

    KeyResult:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        metric_type:
          type: string
          enum: [percentage, number, boolean]
        current_value: { type: number }
        target_value: { type: ["number", "null"] }
        unit: { type: ["string", "null"], example: "project" }
        notes: { type: ["string", "null"] }
        status:
          type: string
          enum: [active, done, abandoned]
        order: { type: integer }
        progress: { type: integer, minimum: 0, maximum: 100 }

    # ── Notifications ─────────────────────────────────────────────────────────

    InAppNotification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, example: habit_streak }
        title: { type: string }
        body: { type: ["string", "null"] }
        action_url: { type: ["string", "null"] }
        data: { type: ["object", "null"] }
        read_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }

    # ── Docs ─────────────────────────────────────────────────────────────────

    Doc:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string }
        description: { type: ["string", "null"] }
        reference_urls:
          type: array
          items:
            type: object
            properties:
              title: { type: ["string", "null"] }
              url: { type: ["string", "null"] }
        files:
          type: array
          items:
            $ref: "#/components/schemas/DocFile"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DocFile:
      type: object
      properties:
        id: { type: integer }
        original_name: { type: string }
        mime_type: { type: string }
        size: { type: integer, description: Ukuran file dalam bytes }
        url: { type: string, description: "URL download via /api/v1/doc-files/{id}" }
        created_at: { type: string, format: date-time }

    # ── Activity ─────────────────────────────────────────────────────────────

    ActivityLog:
      type: object
      properties:
        id: { type: integer }
        event: { type: string, example: task.created }
        label: { type: string, example: "Task Created" }
        record_type: { type: string, example: Task }
        record_id: { type: ["integer", "null"] }
        metadata: { type: ["object", "null"] }
        created_at: { type: string, format: date-time }

    # ── Saved Views ──────────────────────────────────────────────────────────

    SavedView:
      type: object
      properties:
        id: { type: integer }
        module:
          type: string
          enum: [tasks, work-logs, daily-progress, learning, milestones]
        name: { type: string }
        filters: { type: object }
        pinned: { type: boolean }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── References ───────────────────────────────────────────────────────────

    Reference:
      type: object
      properties:
        id: { type: integer }
        referenceable_type:
          type: string
          enum: [task, work_log, learning, milestone, daily_progress]
        referenceable_id: { type: integer }
        label: { type: string }
        url: { type: string, format: uri }
        type:
          type: string
          enum: [link, doc, ticket, pr, article, course, other]
        notes: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }

    # ── Request Schemas ───────────────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 255 }
        timezone: { type: string, example: Asia/Jakarta }
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string, format: password }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        remember: { type: boolean }

    ProfileRequest:
      type: object
      required: [name, email, timezone, theme]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 255 }
        timezone: { type: string }
        theme: { type: string, enum: [system, light, dark] }

    PasswordRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password: { type: string, format: password }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }

    ResetPasswordRequest:
      type: object
      required: [token, email, password, password_confirmation]
      properties:
        token: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }

    TokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        abilities:
          type: array
          description: "Default jika kosong: [read, write, capture, reports]"
          items:
            type: string
            enum: ["*", read, write, capture, reports, tokens]
        expires_at: { type: string, format: date-time }

    ProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        color: { type: ["string", "null"], maxLength: 32 }
        archived: { type: boolean }

    DailyProgressRequest:
      type: object
      required: [date, title]
      properties:
        date: { type: string, format: date }
        title: { type: string }
        in_progress: { type: ["string", "null"] }
        todo: { type: ["string", "null"] }
        blockers: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        completed_items:
          type: array
          items: { type: string }
        mood: { type: ["string", "null"] }
        archived: { type: boolean }
        tags:
          type: array
          items: { type: string, maxLength: 40 }

    WorkLogRequest:
      type: object
      required: [date, project_name, title, category, status, priority]
      properties:
        project_id: { type: ["integer", "null"] }
        task_id: { type: ["integer", "null"] }
        date: { type: string, format: date }
        project_name: { type: string }
        ticket_code: { type: ["string", "null"] }
        title: { type: string }
        category:
          type: string
          enum: [bug, feature, research, testing, setup, meeting, documentation, refactor, other]
        status:
          type: string
          enum: [todo, in_progress, done, blocked]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        description: { type: ["string", "null"] }
        resolution_or_outcome: { type: ["string", "null"] }
        estimated_duration: { type: ["integer", "null"], minimum: 1 }
        actual_duration: { type: ["integer", "null"], minimum: 1 }
        tags:
          type: array
          items: { type: string, maxLength: 40 }

    TaskRequest:
      type: object
      required: [title, status, priority]
      properties:
        project_id: { type: ["integer", "null"] }
        milestone_id: { type: ["integer", "null"] }
        work_log_id: { type: ["integer", "null"] }
        title: { type: string }
        notes: { type: ["string", "null"] }
        status:
          type: string
          enum: [todo, in_progress, done, blocked]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        due_date: { type: ["string", "null"], format: date }
        recurrence_rule:
          type: ["string", "null"]
          enum: [daily, weekly, monthly, custom, null]
        recurrence_interval: { type: ["integer", "null"] }
        recurrence_days:
          type: ["array", "null"]
          items: { type: integer }
        recurrence_ends_at: { type: ["string", "null"], format: date }

    LearningRequest:
      type: object
      required: [date, topic, category, source_type, duration_minutes]
      properties:
        date: { type: string, format: date }
        topic: { type: string }
        category:
          type: string
          enum: [programming, english, japanese, german, books, career, other]
        source_type:
          type: string
          enum: [book, article, video, course, practice, podcast, other]
        duration_minutes: { type: integer, minimum: 1 }
        progress_notes: { type: ["string", "null"] }
        takeaway: { type: ["string", "null"] }
        next_action: { type: ["string", "null"] }
        rating: { type: ["integer", "null"], minimum: 1, maximum: 5 }

    MilestoneRequest:
      type: object
      required: [title, category, target_type, target_value, status]
      properties:
        title: { type: string }
        category: { type: string }
        target_type:
          type: string
          enum: [count, duration, streak, custom]
        source_type:
          type: string
          enum: [manual, work_log_count, work_log_minutes, learning_minutes, daily_progress_streak, task_done_count]
        source_filter: { type: ["string", "null"] }
        target_value: { type: number, minimum: 1 }
        current_value: { type: number }
        start_date: { type: ["string", "null"], format: date }
        end_date: { type: ["string", "null"], format: date }
        status:
          type: string
          enum: [active, paused, completed, cancelled]
        notes: { type: ["string", "null"] }

    HabitRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: ["string", "null"] }
        color: { type: ["string", "null"], maxLength: 20 }
        icon: { type: ["string", "null"], maxLength: 10, description: Emoji }
        frequency:
          type: string
          enum: [daily, weekly]
          default: daily
        target_days:
          type: ["array", "null"]
          items: { type: integer, minimum: 0, maximum: 6 }

    HabitUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/HabitRequest"
        - type: object
          properties:
            active: { type: boolean }
            archived: { type: boolean }
            order: { type: integer }

    GoalRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: ["string", "null"] }
        period_label: { type: ["string", "null"], maxLength: 50 }
        start_date: { type: ["string", "null"], format: date }
        end_date: { type: ["string", "null"], format: date }
        status:
          type: string
          enum: [draft, active, completed, abandoned]
        color: { type: ["string", "null"], maxLength: 20 }
        key_results:
          type: array
          description: KR yang langsung dibuat bersama goal
          items:
            type: object
            required: [title]
            properties:
              title: { type: string, maxLength: 255 }
              metric_type: { type: string, enum: [percentage, number, boolean] }
              target_value: { type: ["number", "null"] }
              unit: { type: ["string", "null"], maxLength: 30 }

    GoalUpdateRequest:
      type: object
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: ["string", "null"] }
        period_label: { type: ["string", "null"], maxLength: 50 }
        start_date: { type: ["string", "null"], format: date }
        end_date: { type: ["string", "null"], format: date }
        status:
          type: string
          enum: [draft, active, completed, abandoned]
        color: { type: ["string", "null"], maxLength: 20 }

    KeyResultRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 255 }
        metric_type:
          type: string
          enum: [percentage, number, boolean]
        current_value: { type: ["number", "null"] }
        target_value: { type: ["number", "null"] }
        unit: { type: ["string", "null"], maxLength: 30 }
        notes: { type: ["string", "null"] }

    KeyResultUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/KeyResultRequest"
        - type: object
          properties:
            status:
              type: string
              enum: [active, done, abandoned]

    QuickCaptureRequest:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [task, blocker, work_log, daily_progress, learning]
          description: |
            - `task` → buat task dengan status todo
            - `blocker` → buat task dengan status blocked
            - `work_log` → buat work log
            - `daily_progress` → buat entri progress harian
            - `learning` → buat entri belajar
        title:
          type: string
          maxLength: 180
          description: Judul record (untuk learning dipakai sebagai topic)
        date:
          type: ["string", "null"]
          format: date
          description: Default ke hari ini
        project_name:
          type: ["string", "null"]
          maxLength: 120
          description: Nama project (untuk work_log dan task)
        duration_minutes:
          type: ["integer", "null"]
          minimum: 1
          maximum: 10000
          description: Durasi dalam menit (untuk work_log dan learning)
        notes:
          type: ["string", "null"]
          description: Catatan tambahan

    SavedViewRequest:
      type: object
      required: [module, name, filters]
      properties:
        module:
          type: string
          enum: [tasks, work-logs, daily-progress, learning, milestones]
        name: { type: string, maxLength: 80 }
        filters:
          type: object
          description: Object filter bebas sesuai query params modul
        pinned: { type: boolean }

    ReferenceRequest:
      type: object
      required: [referenceable_type, referenceable_id, label, url, type]
      properties:
        referenceable_type:
          type: string
          enum: [task, work_log, learning, milestone, daily_progress]
        referenceable_id: { type: integer }
        label: { type: string, maxLength: 160 }
        url: { type: string, format: uri, maxLength: 2000 }
        type:
          type: string
          enum: [link, doc, ticket, pr, article, course, other]
        notes: { type: ["string", "null"] }

    DocRequest:
      type: object
      required: [title, category]
      properties:
        title: { type: string, maxLength: 255 }
        category: { type: string, maxLength: 100 }
        description: { type: ["string", "null"] }
        reference_urls:
          type: ["array", "null"]
          items:
            type: object
            properties:
              title: { type: ["string", "null"], maxLength: 255 }
              url: { type: ["string", "null"], format: uri, maxLength: 2000 }
