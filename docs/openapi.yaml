openapi: 3.1.0
info:
  title: ProgressOS API
  version: 2.0.0
  description: |
    REST API untuk ProgressOS — personal productivity operating system.

    ## Autentikasi

    Gunakan **bearer token** yang dibuat via `POST /api/tokens`:

    ```
    Authorization: Bearer pos_your_token_here
    Accept: application/json
    ```

    ### Token abilities

    | Ability | Akses |
    |---------|-------|
    | `read` | GET semua resource |
    | `write` | Create / update / delete record |
    | `capture` | POST `/api/v1/quick-capture` |
    | `reports` | Report dan export |
    | `tokens` | Kelola token |

    Untuk bot Telegram / Groq AI, buat token dengan abilities `["read", "write", "capture"]`.

    ## Response envelope

    Semua response menggunakan envelope JSON konsisten:
    - **Item**: `{ "data": {...}, "message": "...", "<key>": {...} }`
    - **Collection**: `{ "data": [...], "<key>": [...] }`
    - **Paginated**: `{ "data": [...], "meta": {...}, "links": {...}, "<key>": [...] }`

    ## Rate limiting

    - Read: `api-read` limiter
    - Write: `api-write` limiter
    - Capture: `api-capture` limiter
    - Export: `api-export` limiter

servers:
  - url: http://127.0.0.1:8000
    description: Local development

security:
  - sanctumBearer: []

tags:
  - name: Auth
    description: Registrasi, login, profil
  - name: Tokens
    description: Manajemen personal access token
  - name: Dashboard
    description: Ringkasan metrik dan aktivitas terkini
  - name: Analytics
    description: Chart dan statistik agregat
  - name: Standup
    description: Generator laporan standup harian
  - name: Projects
    description: Manajemen proyek
  - name: Daily Progress
    description: Entri progress harian / end-of-day
  - name: Work Logs
    description: Log sesi kerja dengan project, kategori, dan durasi
  - name: Tasks
    description: Manajemen task dengan status, prioritas, dan recurrence
  - name: Learning
    description: Log sesi belajar dengan kategori, source type, dan durasi
  - name: Milestones
    description: Milestone dengan auto-progress tracking
  - name: Habits
    description: Habit tracking dengan streak dan heatmap
  - name: Goals
    description: OKR-style goals dengan key results
  - name: Notifications
    description: Manajemen notifikasi in-app
  - name: Docs
    description: Knowledge base dokumen personal
  - name: Capture
    description: Quick capture untuk bot dan automation
  - name: Reports
    description: Laporan mingguan / bulanan dan export
  - name: Search
    description: Pencarian global lintas semua modul
  - name: Activity
    description: Feed audit aktivitas
  - name: Saved Views
    description: Preset filter tersimpan per modul
  - name: References
    description: Link referensi yang dilampirkan ke record
  - name: Configuration
    description: Pengaturan app, backup, dan integrasi

paths:

  # ─── AUTH ──────────────────────────────────────────────────────────────────

  /api/register:
    post:
      tags: [Auth]
      summary: Daftar user baru
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              name: Yosri
              email: yosri@example.com
              timezone: Asia/Jakarta
              password: secret123
              password_confirmation: secret123
      responses:
        "201":
          $ref: "#/components/responses/UserResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/login:
    post:
      tags: [Auth]
      summary: Login dengan email dan password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: yosri@example.com
              password: secret123
              remember: false
      responses:
        "200":
          $ref: "#/components/responses/UserResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/logout:
    post:
      tags: [Auth]
      summary: Logout sesi saat ini
      responses:
        "200":
          $ref: "#/components/responses/OkResponse"

  /api/me:
    get:
      tags: [Auth]
      summary: Data user yang sedang login
      security:
        - sanctumBearer: [read]
      responses:
        "200":
          $ref: "#/components/responses/UserResponse"

  /api/profile:
    patch:
      tags: [Auth]
      summary: Update profil
      security:
        - sanctumBearer: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
      responses:
        "200":
          $ref: "#/components/responses/UserResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/profile/avatar:
    post:
      tags: [Auth]
      summary: Upload avatar
      security:
        - sanctumBearer: [write]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          $ref: "#/components/responses/UserResponse"

  /api/profile/password:
    put:
      tags: [Auth]
      summary: Ganti password
      security:
        - sanctumBearer: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkResponse"

  /api/forgot-password:
    post:
      tags: [Auth]
      summary: Kirim link reset password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          $ref: "#/components/responses/OkResponse"

  /api/reset-password:
    post:
      tags: [Auth]
      summary: Reset password dengan token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkResponse"

  # ─── TOKENS ────────────────────────────────────────────────────────────────

  /api/tokens:
    get:
      tags: [Tokens]
      summary: Daftar personal access token
      description: Membutuhkan ability `tokens`.
      security:
        - sanctumBearer: [tokens]
      responses:
        "200":
          description: Daftar token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CollectionEnvelope"
                  - type: object
                    properties:
                      tokens:
                        type: array
                        items:
                          $ref: "#/components/schemas/Token"
              example:
                data:
                  - id: 1
                    name: TelegramBot
                    abilities: [read, write, capture]
                    last_used_at: "2026-06-19T10:00:00Z"
                    expires_at: null
                    created_at: "2026-01-01T00:00:00Z"
                tokens:
                  - id: 1
                    name: TelegramBot
                    abilities: [read, write, capture]
                    last_used_at: "2026-06-19T10:00:00Z"
                    expires_at: null
                    created_at: "2026-01-01T00:00:00Z"
    post:
      tags: [Tokens]
      summary: Buat personal access token
      description: |
        Token hanya ditampilkan sekali via `plain_text_token`. Simpan dengan aman.
        Untuk bot Telegram / Groq, gunakan abilities `["read", "write", "capture"]`.
      security:
        - sanctumBearer: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
            examples:
              bot_token:
                summary: Token untuk bot Telegram
                value:
                  name: TelegramBot
                  abilities: [read, write, capture]
              full_token:
                summary: Token penuh (local dev)
                value:
                  name: LocalDev
                  abilities: ["*"]
                  expires_at: "2027-01-01T00:00:00+07:00"
      responses:
        "201":
          description: Token dibuat — `plain_text_token` hanya tampil sekali
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Token"
                  token:
                    $ref: "#/components/schemas/Token"
                  plain_text_token:
                    type: string
                    description: Bearer token yang harus disimpan — tidak bisa diambil lagi
              example:
                data:
                  id: 2
                  name: TelegramBot
                  abilities: [read, write, capture]
                  last_used_at: null
                  expires_at: null
                  created_at: "2026-06-19T10:00:00Z"
                token:
                  id: 2
                  name: TelegramBot
                  abilities: [read, write, capture]
                  last_used_at: null
                  expires_at: null
                  created_at: "2026-06-19T10:00:00Z"
                plain_text_token: pos_abc123def456ghi789

  /api/tokens/{token}:
    delete:
      tags: [Tokens]
      summary: Cabut personal access token
      security:
        - sanctumBearer: [tokens]
      parameters:
        - $ref: "#/components/parameters/TokenId"
      responses:
        "204":
          description: Token dicabut

  # ─── DASHBOARD ─────────────────────────────────────────────────────────────

  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Metrik dashboard, chart, dan record terbaru
      description: Mengembalikan ringkasan metrik, task overdue, log terbaru, dan progress harian.
      security:
        - sanctumBearer: [read]
      responses:
        "200":
          description: Payload dashboard
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ─── ANALYTICS ─────────────────────────────────────────────────────────────

  /api/v1/analytics:
    get:
      tags: [Analytics]
      summary: Statistik dan chart agregat
      description: Di-cache 5 menit. Mencakup heatmap, task velocity, jam kerja bulanan, kategori, perbandingan belajar vs kerja, habit, dan goals aktif.
      security:
        - sanctumBearer: [read]
      responses:
        "200":
          description: Payload analytics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      work_heatmap:
                        type: array
                        description: 90 hari terakhir
                        items:
                          type: object
                          properties:
                            date: { type: string, format: date }
                            minutes: { type: integer }
                      task_velocity:
                        type: array
                        description: 8 minggu terakhir — task selesai per minggu
                        items:
                          type: object
                          properties:
                            week: { type: string, example: "Jun 09" }
                            count: { type: integer }
                      monthly_work:
                        type: array
                        description: 6 bulan terakhir — jam kerja per bulan
                        items:
                          type: object
                          properties:
                            month: { type: string, example: "2026-06" }
                            minutes: { type: integer }
                            logs: { type: integer }
                      by_category:
                        type: array
                        items:
                          type: object
                          properties:
                            category: { type: string }
                            minutes: { type: integer }
                            logs: { type: integer }
                      task_status:
                        type: object
                        properties:
                          todo: { type: integer }
                          in_progress: { type: integer }
                          done: { type: integer }
                          blocked: { type: integer }
                      learn_vs_work:
                        type: array
                        description: 4 minggu terakhir
                        items:
                          type: object
                          properties:
                            week: { type: string }
                            learning: { type: integer }
                            work: { type: integer }
                      totals:
                        type: object
                        properties:
                          work_logs: { type: integer }
                          work_minutes: { type: integer }
                          tasks_done: { type: integer }
                          tasks_total: { type: integer }
                          learning_minutes: { type: integer }
                          daily_progress: { type: integer }
                          completion_rate: { type: integer }
                      productivity_score:
                        type: integer
                        minimum: 0
                        maximum: 100
                        description: Skor produktivitas komposit (0–100)
                      habit_weeks:
                        type: array
                        items:
                          type: object
                          properties:
                            week: { type: string }
                            rate: { type: integer }
                            logged: { type: integer }
                            active: { type: integer }
                      active_goals:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            title: { type: string }
                            color: { type: ["string", "null"] }
                            progress: { type: integer }

  # ─── STANDUP ───────────────────────────────────────────────────────────────

  /api/v1/standup:
    get:
      tags: [Standup]
      summary: Generate laporan standup harian
      description: Mengambil work log selesai kemarin/hari ini, task hari ini, dan blocker. Field `text` berisi markdown siap-pakai untuk standup meeting.
      security:
        - sanctumBearer: [read]
      responses:
        "200":
          description: Payload standup
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      date: { type: string, format: date }
                      done_logs:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            title: { type: string }
                            project_name: { type: ["string", "null"] }
                            actual_duration: { type: ["integer", "null"] }
                      completed_tasks:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            title: { type: string }
                            priority: { type: string }
                      today_tasks:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            title: { type: string }
                            status: { type: string }
                            priority: { type: string }
                      blockers:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            title: { type: string }
                      text:
                        type: string
                        description: Teks standup ter-format (Markdown)

  # ─── PROJECTS ──────────────────────────────────────────────────────────────

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: Daftar proyek aktif
      security:
        - sanctumBearer: [read]
      responses:
        "200":
          description: Koleksi proyek
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CollectionEnvelope"
                  - type: object
                    properties:
                      projects:
                        type: array
                        items:
                          $ref: "#/components/schemas/Project"
              example:
                data:
                  - id: 1
                    name: ProgressOS
                    color: "#6366f1"
                    archived: false
                    tasks_count: 12
                    open_tasks_count: 5
                    work_logs_count: 48
                    created_at: "2025-01-01T00:00:00Z"
                    updated_at: "2026-06-19T10:00:00Z"
                projects:
                  - id: 1
                    name: ProgressOS
                    color: "#6366f1"
                    archived: false
                    tasks_count: 12
                    open_tasks_count: 5
                    work_logs_count: 48
                    created_at: "2025-01-01T00:00:00Z"
                    updated_at: "2026-06-19T10:00:00Z"

  /api/v1/projects/{project}:
    get:
      tags: [Projects]
      summary: Detail proyek dengan task, work log, dan metrik
      security:
        - sanctumBearer: [read]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Detail proyek
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      project:
                        $ref: "#/components/schemas/Project"
                      tasks:
                        type: array
                        items:
                          $ref: "#/components/schemas/Task"
                      workLogs:
                        type: array
                        items:
                          $ref: "#/components/schemas/WorkLog"
                      metrics:
                        type: object
                        additionalProperties: true
        "404":
          description: Proyek tidak ditemukan
    patch:
      tags: [Projects]
      summary: Update proyek
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        $ref: "#/components/requestBodies/Project"
      responses:
        "200":
          description: Proyek diperbarui

  # ─── DAILY PROGRESS ────────────────────────────────────────────────────────

  /api/v1/daily-progress:
    get:
      tags: [Daily Progress]
      summary: Daftar entri progress harian
      security:
        - sanctumBearer: [read]
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: tag
          in: query
          schema: { type: string }
        - name: archived
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          $ref: "#/components/responses/PaginatedDailyProgress"
    post:
      tags: [Daily Progress]
      summary: Buat entri progress harian
      security:
        - sanctumBearer: [write]
      requestBody:
        $ref: "#/components/requestBodies/DailyProgress"
      responses:
        "201":
          description: Entri dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      entry:
                        $ref: "#/components/schemas/DailyProgress"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/daily-progress/{dailyProgress}:
    get:
      tags: [Daily Progress]
      summary: Detail entri progress harian
      security:
        - sanctumBearer: [read]
      parameters:
        - $ref: "#/components/parameters/DailyProgressId"
      responses:
        "200":
          description: Detail entri
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      entry:
                        $ref: "#/components/schemas/DailyProgress"
    patch:
      tags: [Daily Progress]
      summary: Update entri progress harian
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/DailyProgressId"
      requestBody:
        $ref: "#/components/requestBodies/DailyProgress"
      responses:
        "200":
          description: Entri diperbarui
    delete:
      tags: [Daily Progress]
      summary: Hapus entri progress harian
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/DailyProgressId"
      responses:
        "204":
          description: Dihapus

  # ─── WORK LOGS ─────────────────────────────────────────────────────────────

  /api/v1/work-logs:
    get:
      tags: [Work Logs]
      summary: Daftar work log
      security:
        - sanctumBearer: [read]
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, in_progress, done, blocked]
        - name: category
          in: query
          schema: { type: string }
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - name: project_name
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          $ref: "#/components/responses/PaginatedWorkLogs"
    post:
      tags: [Work Logs]
      summary: Buat work log
      security:
        - sanctumBearer: [write]
      requestBody:
        $ref: "#/components/requestBodies/WorkLog"
      responses:
        "201":
          description: Work log dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      log:
                        $ref: "#/components/schemas/WorkLog"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/work-logs/{workLog}:
    get:
      tags: [Work Logs]
      summary: Detail work log
      security:
        - sanctumBearer: [read]
      parameters:
        - $ref: "#/components/parameters/WorkLogId"
      responses:
        "200":
          description: Detail work log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      log:
                        $ref: "#/components/schemas/WorkLog"
    patch:
      tags: [Work Logs]
      summary: Update work log
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/WorkLogId"
      requestBody:
        $ref: "#/components/requestBodies/WorkLog"
      responses:
        "200":
          description: Work log diperbarui
    delete:
      tags: [Work Logs]
      summary: Hapus work log
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/WorkLogId"
      responses:
        "204":
          description: Dihapus

  # ─── TASKS ─────────────────────────────────────────────────────────────────

  /api/v1/tasks:
    get:
      tags: [Tasks]
      summary: Daftar task (paginated)
      security:
        - sanctumBearer: [read]
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, in_progress, done, blocked]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - name: project_id
          in: query
          schema: { type: integer }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          $ref: "#/components/responses/PaginatedTasks"
    post:
      tags: [Tasks]
      summary: Buat task
      security:
        - sanctumBearer: [write]
      requestBody:
        $ref: "#/components/requestBodies/Task"
      responses:
        "201":
          description: Task dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      task:
                        $ref: "#/components/schemas/Task"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/tasks/kanban:
    get:
      tags: [Tasks]
      summary: Board kanban task dikelompokkan per status
      description: Mengembalikan task dikelompokkan ke todo, in_progress, blocked, done. Done dibatasi 20 terbaru, lainnya 50 terbaru.
      security:
        - sanctumBearer: [read]
      responses:
        "200":
          description: Board kanban
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      board:
                        type: object
                        properties:
                          todo:
                            type: array
                            items:
                              $ref: "#/components/schemas/KanbanCard"
                          in_progress:
                            type: array
                            items:
                              $ref: "#/components/schemas/KanbanCard"
                          blocked:
                            type: array
                            items:
                              $ref: "#/components/schemas/KanbanCard"
                          done:
                            type: array
                            items:
                              $ref: "#/components/schemas/KanbanCard"

  /api/v1/tasks/overdue-count:
    get:
      tags: [Tasks]
      summary: Jumlah task overdue
      security:
        - sanctumBearer: [read]
      responses:
        "200":
          description: Jumlah task melewati due date
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      count: { type: integer }
              example:
                count: 3

