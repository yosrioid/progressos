    get:
      tags: [Tasks]
      summary: Detail task
      security:
        - sanctumBearer: [read]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Detail task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      task:
                        $ref: "#/components/schemas/Task"
    patch:
      tags: [Tasks]
      summary: Update task
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        $ref: "#/components/requestBodies/Task"
      responses:
        "200":
          description: Task diperbarui
    delete:
      tags: [Tasks]
      summary: Hapus task
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Dihapus

  /api/v1/tasks/{task}/status:
    patch:
      tags: [Tasks]
      summary: Update status task saja
      description: Endpoint ringkas untuk mengubah status task. Otomatis set `completed_at` saat status berubah ke `done`. Jika task punya `recurrence_rule`, task berikutnya akan dibuat otomatis.
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [todo, in_progress, done, blocked]
            example:
              status: done
      responses:
        "200":
          description: Status diperbarui

