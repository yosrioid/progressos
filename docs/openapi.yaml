      tags: [Goals]
      summary: Update goal
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdateRequest"
      responses:
        "200":
          description: Goal diperbarui
    delete:
      tags: [Goals]
      summary: Hapus goal
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      responses:
        "204":
          description: Dihapus

  /api/v1/goals/{goal}/key-results:
    post:
      tags: [Goals]
      summary: Tambah key result ke goal
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyResultRequest"
