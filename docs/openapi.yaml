                        type: array
                        items:
                          $ref: "#/components/schemas/Goal"
    post:
      tags: [Goals]
      summary: Buat goal baru
      description: Bisa menyertakan `key_results` array untuk membuat KR sekaligus.
      security:
        - sanctumBearer: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalRequest"
            example:
              title: Kuasai Golang di Q3 2026
              description: Fokus ke backend dan concurrency patterns
              period_label: Q3 2026
              start_date: "2026-07-01"
              end_date: "2026-09-30"
              status: active
              color: "#06b6d4"
              key_results:
                - title: Selesaikan 3 project Go
                  metric_type: number
                  target_value: 3
                  unit: project
                - title: Baca The Go Programming Language
                  metric_type: boolean
      responses:
        "201":
          description: Goal dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      goal:
                        $ref: "#/components/schemas/Goal"

