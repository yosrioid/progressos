      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, completed, abandoned]
      responses:
        "200":
          description: Daftar goal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
