  /api/v1/habits:
    get:
      tags: [Habits]
      summary: Daftar habit dengan status hari ini, streak, dan heatmap
      security:
        - sanctumBearer: [read]
      responses:
        "200":
          description: Daftar habit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      habits:
                        type: array
                        items:
                          $ref: "#/components/schemas/Habit"
                      today:
                        type: string
                        format: date
              example:
                habits:
                  - id: 1
                    name: Olahraga
                    description: 30 menit setiap hari
                    color: "#22c55e"
                    icon: "🏋️"
                    frequency: daily
                    target_days: null
                    active: true
                    order: 0
                    today_done: true
                    streak: 7
                    week_dates: ["2026-06-13", "2026-06-14", "2026-06-19"]
                    heatmap: ["2026-04-01", "2026-04-02"]
                    total_logs: 45
                today: "2026-06-19"
    post:
      tags: [Habits]
      summary: Buat habit baru
      security:
        - sanctumBearer: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitRequest"
            example:
              name: Baca buku
              description: 20 halaman per hari
              color: "#f59e0b"
              icon: "📚"
              frequency: daily
      responses:
        "201":
          description: Habit dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      habit:
                        $ref: "#/components/schemas/Habit"

  /api/v1/habits/reorder:
    post:
      tags: [Habits]
      summary: Atur ulang urutan habit
      security:
        - sanctumBearer: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer }
            example:
              ids: [3, 1, 2]
      responses:
        "200":
          description: Urutan disimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      reordered: { type: boolean }

  /api/v1/habits/{habit}:
    patch:
      tags: [Habits]
      summary: Update habit
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/HabitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdateRequest"
      responses:
        "200":
          description: Habit diperbarui
    delete:
      tags: [Habits]
      summary: Hapus habit
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/HabitId"
      responses:
        "204":
          description: Dihapus

  /api/v1/habits/{habit}/log:
    post:
      tags: [Habits]
      summary: Catat habit selesai untuk tanggal tertentu
      description: Idempotent — kalau sudah di-log di tanggal yang sama, tidak akan duplikat. Otomatis trigger notifikasi milestone streak.
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/HabitId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  description: Default ke hari ini
                notes:
                  type: ["string", "null"]
            example:
              date: "2026-06-19"
              notes: 30 menit di gym
      responses:
        "200":
          description: Log dicatat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      logged: { type: boolean }
                      date: { type: string, format: date }
                      log_id: { type: integer }
                      streak: { type: integer }
              example:
                logged: true
                date: "2026-06-19"
                log_id: 142
                streak: 7
    delete:
      tags: [Habits]
      summary: Batalkan log habit untuk tanggal tertentu
      security:
        - sanctumBearer: [write]
      parameters:
        - $ref: "#/components/parameters/HabitId"
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Default ke hari ini
      responses:
        "200":
          description: Log dibatalkan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      unlogged: { type: boolean }
                      date: { type: string, format: date }

